name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id || steps.create-draft-release.outputs.id }} # yamllint disable-line rule:line-length
      release_body: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog for version
        if: github.event_name != 'workflow_dispatch'
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section between "## v{VERSION}" and the next "## v" heading
          CONTENT=$(sed -n "/^## v${VERSION}/,/^## v/{/^## v${VERSION}/d;/^## v/d;p}" CHANGELOG.md)
          EOF_MARKER=$(openssl rand -hex 8)
          echo "body<<$EOF_MARKER" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "$EOF_MARKER" >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.event_name != 'workflow_dispatch'
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'VigilClip ${{ github.ref_name }}'
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false

      - name: Create Draft Release (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        id: create-draft-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: draft-${{ github.sha }}
          name: 'Draft Build (${{ github.ref_name }} @ ${{ github.sha }})'
          body: 'Test build from `${{ github.ref_name }}` at `${{ github.sha }}`' # yamllint disable-line rule:line-length
          draft: true
          prerelease: true

  release:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'windows-latest'
            target: 'aarch64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }} # yamllint disable-line rule:line-length

      - name: Install frontend dependencies
        run: pnpm install
        working-directory: frontend

      - name: Get version info
        id: version
        run: echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseBody: ${{ needs.create-release.outputs.release_body }}
          args: --target ${{ matrix.target }}

      - name: Collect the portable build
        if: success()
        shell: bash
        run: |
          # The raw executable is the portable build: Rust links statically
          # and WebView2 is part of Windows, so nothing travels with it.
          SOURCE="src-tauri/target/${{ matrix.target }}/release/vigilclip.exe"
          if [ ! -f "$SOURCE" ]; then
            echo "::error::No executable at $SOURCE"
            exit 1
          fi
          ARCH="${{ matrix.target }}"
          NAME="VigilClip_${GITHUB_REF_NAME#v}_${ARCH%%-*}_portable.exe"
          cp "$SOURCE" "$NAME"
          echo "PORTABLE_ASSET=$NAME" >> "$GITHUB_ENV"

      # Only on a real release: a workflow_dispatch run builds a draft whose
      # tag name does not exist yet.
      - name: Attach the portable build
        if: success() && github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.PORTABLE_ASSET }}
